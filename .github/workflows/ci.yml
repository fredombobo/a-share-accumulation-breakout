name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (full repo)
        run: ruff check . --exclude web/frontend/node_modules

      - name: Mypy (key modules)
        run: |
          mypy signals.py optimizer.py walkforward.py local_store.py config.py \
            ab_screener/domain/costs.py ab_screener/domain/entry_definition.py \
            ab_screener/domain/entry_definition_v2.py \
            ab_screener/research/backtest_engine.py ab_screener/research/trusted_run.py \
            ab_screener/research/professional_grid.py ab_screener/research/condition_plugins.py \
            ab_screener/research/professional_runner.py \
            ab_screener/research/data_scope.py ab_screener/research/result_details.py \
            ab_screener/research/pit_reader.py ab_screener/research/regime_filter.py \
            ab_screener/research/resilient_absorption.py ab_screener/research/post_breakout_supply_dry_up.py \
            ab_screener/operations/runtime_identity.py ab_screener/operations/personal_daily.py \
            ab_screener/data/benchmark_pit_sync.py \
            ab_screener/api/routers/professional_backtest.py \
            ab_screener/api/routers/lean_ai_review.py \
            ab_screener/intelligence/ai_analysis.py ab_screener/application/today_guide.py \
            paper_trading/rules.py paper_trading/engine.py backtest_custom.py web/backend_app.py

      - name: Architecture boundaries
        run: python scripts/check_architecture.py --strict

      - name: Pytest (offline suite)
        env:
          # SDK construction requires a nonempty token even when tests mock queries.
          # These are deliberately invalid fixtures, never live vendor credentials.
          TUSHARE_TOKEN: offline-ci-not-a-valid-token
          TUSHARE_HTTP_URL: https://offline-vendor.invalid/
        run: pytest tests/ -q -k "not browser"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Frontend unit tests
        run: npm test

      - name: Type-check + build
        run: npm run build
