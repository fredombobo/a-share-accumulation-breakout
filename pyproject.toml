[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# 选择性忽略（项目既有代码风格约定）：
#   DTZ005/DTZ007 — 历史代码 datetime.now() 无显式时区（paper_trading 内已统一 Asia/Shanghai）
#   S110          — try/except/pass 用于容错降级（如缓存/日历兜底），显式记录风险
#   RUF046        — int() 包已有 int 的冗余（SQLite 数值列）——保持显式，可读性优先
#   PLR0124       — x != x 用于 NaN 判断（成本校验）
ignore = [
    "DTZ005", "DTZ007", "S110", "RUF046", "PLR0124", "ISC004",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
markers = [
    "fault_injection: 七类故障注入（同步失败/行情缺失/公司行为/撮合中断/对账差异/审计写失败/进程重启）",
    "performance: 性能标记（长耗时或大数据量用例）",
]
